name: Run AI Digest

on:
  workflow_dispatch:        # запуск вручную
  schedule:
    - cron: "0 21 * * *"    # каждый день в 21:00 UTC (можем изменить)

jobs:
  run-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install "openai>=1.40.0" psycopg2-binary python-dotenv

      - name: Show installed versions
        run: |
          python -c "import openai, psycopg2; print('openai:', openai.__version__); print('psycopg2:', psycopg2.__version__)"

      - name: Run AI processing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python scripts/process_ai.py
