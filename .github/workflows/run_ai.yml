name: Run AI Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"   # каждый день 21:00 UTC (в Сербии это обычно 22:00/23:00)

jobs:
  run-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install "openai>=1.0.0" psycopg2-binary python-dotenv

      - name: Show installed versions
        run: |
          python -c "import openai; print('openai:', getattr(openai,'__version__','(no __version__)'))"

      - name: Run AI processing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python scripts/process_ai.py
