name: Nightly recalc (London midnight)

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (UTC)
  workflow_dispatch: {}

jobs:
  recalc:
    runs-on: ubuntu-latest
    steps:
      - name: Check London time and run RPC
        env:
          SUPABASE_URL: https://dcaclbmeuzrnsapkhkuf.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - << 'PY'
          from datetime import datetime, timezone
          try:
            from zoneinfo import ZoneInfo
          except ImportError:
            from backports.zoneinfo import ZoneInfo

          now_london = datetime.now(ZoneInfo("Europe/London"))
          # запускаем только в первые 10 минут после полуночи
          if not (now_london.hour == 0 and 0 <= now_london.minute < 10):
            print("Not London midnight window:", now_london.isoformat())
            raise SystemExit(0)

          print("Running recalc at London time:", now_london.isoformat())

          import os, subprocess, json
          url = os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/rpc/recalculate_all_question_stats_and_difficulty"
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]

          cmd = [
            "curl", "-sS", "-X", "POST", url,
            "-H", f"apikey: {key}",
            "-H", f"Authorization: Bearer {key}",
            "-H", "Content-Type: application/json",
            "-d", "{}"
          ]
          res = subprocess.run(cmd, capture_output=True, text=True)
          print("curl exit:", res.returncode)
          print("stdout:", res.stdout)
          print("stderr:", res.stderr)
          if res.returncode != 0:
            raise SystemExit(res.returncode)
          PY
